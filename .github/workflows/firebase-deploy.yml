name: Deploy to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/scheduling-attendance-app-zxwsP

jobs:
  deploy-demo:
    name: Build & deploy Delo ERP demo
    runs-on: ubuntu-latest
    environment: FIREBASE_TOKEN_DEMO
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build demo bundle
        run: npm run build:demo
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.DEMO_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: edupilot-demo.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: edupilot-demo
          VITE_FIREBASE_STORAGE_BUCKET: edupilot-demo.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "192247415331"
          VITE_FIREBASE_APP_ID: ${{ secrets.DEMO_FIREBASE_APP_ID }}
          VITE_DEFAULT_INSTITUTE_NAME: Institut Horizon
          VITE_DEFAULT_PRIMARY_COLOR: "#1a5f8a"
          VITE_EMAIL_DOMAIN: edupilot-demo.com
          VITE_USE_FIREBASE_EMULATORS: "false"

      - name: Write demo service account key
        run: echo "$FIREBASE_TOKEN_DEMO" > /tmp/sa_demo.json
        env:
          FIREBASE_TOKEN_DEMO: ${{ secrets.FIREBASE_TOKEN_DEMO }}

      - name: Deploy Firestore rules to edupilot-demo
        run: npx firebase-tools@latest deploy --only firestore:rules --project edupilot-demo --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa_demo.json

      - name: Deploy hosting to edupilot-demo
        run: npx firebase-tools@latest deploy --only hosting:edupilot-demo --project edupilot-demo --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa_demo.json
