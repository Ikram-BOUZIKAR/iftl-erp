name: Deploy to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/scheduling-attendance-app-zxwsP

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: FIREBASE_TOKEN
    steps:
      - uses: actions/checkout@v4

      - name: Write service account key
        run: echo "$FIREBASE_TOKEN" > /tmp/sa.json
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@latest deploy --only hosting --project erp-pedago-iftl --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
