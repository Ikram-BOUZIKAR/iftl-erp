name: Deploy to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/scheduling-attendance-app-zxwsP

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Test runner
        run: echo "Runner OK"

      - uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@latest deploy --only hosting,firestore:rules,firestore:indexes --project erp-pedago-iftl --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
